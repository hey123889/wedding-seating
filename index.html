<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 18px; }

  body {
    font-family: 'Noto Serif TC', '華康明體', 'Times New Roman', serif;
    background: #faf8f3;
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Decorative background leaves using CSS */
  .bg-decor {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }
  .bg-decor.top-right {
    top: -30px; right: -20px;
    width: 180px; height: 180px;
    background: radial-gradient(ellipse at 80% 20%, rgba(122,140,110,0.12) 0%, transparent 70%);
  }
  .bg-decor.bot-left {
    bottom: -30px; left: -20px;
    width: 160px; height: 160px;
    background: radial-gradient(ellipse at 20% 80%, rgba(122,140,110,0.1) 0%, transparent 70%);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    position: relative;
    z-index: 1;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 24px 0 12px;
  }
  .header .leaf-top {
    display: block;
    margin: 0 auto 8px;
    opacity: 0.25;
  }
  .couple-name {
    font-size: 2rem;
    font-weight: 700;
    color: #7b6b2e;
    letter-spacing: 6px;
    text-shadow: 0 1px 2px rgba(123,107,46,0.12);
  }
  .subtitle {
    font-size: 1.05rem;
    color: #7e9470;
    letter-spacing: 8px;
    margin-top: 4px;
  }
  .divider {
    margin: 14px auto;
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #9b8b4a, transparent);
  }

  /* ===== Search ===== */
  .search-section {
    margin-bottom: 16px;
    text-align: center;
  }
  .search-label {
    display: block;
    font-size: 1.05rem;
    color: #666;
    margin-bottom: 12px;
  }
  .search-box {
    position: relative;
    max-width: 380px;
    margin: 0 auto;
  }
  .search-box input {
    width: 100%;
    padding: 16px 56px 16px 22px;
    font-size: 1.2rem;
    font-family: inherit;
    border: 2px solid #c9c4ab;
    border-radius: 50px;
    background: #fff;
    color: #333;
    outline: none;
    transition: all 0.3s;
    -webkit-appearance: none;
  }
  .search-box input:focus {
    border-color: #7b6b2e;
    box-shadow: 0 0 0 4px rgba(184,150,12,0.1);
  }
  .search-box input::placeholder { color: #bbb; }
  .clear-btn {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: #e5e2d5;
    color: #999;
    font-size: 1.3rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .clear-btn.show { display: flex; }
  .clear-btn:active { background: #d4c9a8; }

  /* ===== Suggestions ===== */
  .suggestions {
    max-width: 380px;
    margin: 8px auto 0;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 30px rgba(0,0,0,0.1);
    overflow: hidden;
    display: none;
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 16px 22px;
    cursor: pointer;
    border-bottom: 1px solid #f0ede4;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:active { background: #f8f5ec; }
  .suggestion-item .s-name {
    font-weight: 700;
    font-size: 1.15rem;
    color: #333;
  }
  .suggestion-item .s-table {
    font-size: 0.9rem;
    color: #7e9470;
    margin-top: 2px;
  }

  .no-result {
    text-align: center;
    color: #9b8b4a;
    font-size: 1.05rem;
    margin: 18px 0;
    display: none;
    line-height: 1.7;
  }
  .no-result.show { display: block; }

  /* ===== Result Card ===== */
  .result-card {
    max-width: 400px;
    margin: 0 auto 20px;
    background: linear-gradient(160deg, #fffef9, #f5f0e0);
    border: 1.5px solid #c9c4ab;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    display: none;
    animation: fadeSlideIn 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(122,140,110,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .result-card.show { display: block; }
  .r-greeting {
    font-size: 0.95rem;
    color: #7e9470;
    margin-bottom: 6px;
  }
  .r-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #7b6b2e;
    margin-bottom: 16px;
  }
  .r-table {
    display: inline-block;
    background: linear-gradient(135deg, #7e9470, #637a55);
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 3px;
    box-shadow: 0 4px 12px rgba(107,125,94,0.25);
  }
  .r-group {
    font-size: 1rem;
    color: #777;
    margin-top: 14px;
  }
  .r-hint {
    font-size: 0.8rem;
    color: #9b8b4a;
    margin-top: 14px;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Floor Map ===== */
  .map-section { margin: 0 0 16px; }
  .map-title {
    text-align: center;
    font-size: 0.95rem;
    color: #7e9470;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  .map-wrapper {
    border: 1.5px solid #c9c4ab;
    border-radius: 16px;
    background: linear-gradient(180deg, #fdfcf8, #f7f4ec);
    padding: 16px 8px 20px;
  }

  /* Vertical map layout - two columns */
  .floor-map {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-bottom: 4px;
  }

  /* Stage */
  .stage {
    width: 90%;
    max-width: 320px;
    padding: 8px 0;
    background: linear-gradient(90deg, #e8e3d5, #ddd6c3);
    text-align: center;
    font-size: 0.9rem;
    color: #999;
    letter-spacing: 8px;
    border-radius: 8px;
  }

  /* Main table row */
  .main-row {
    display: flex;
    justify-content: center;
  }

  /* Two-column body */
  .table-columns {
    display: flex;
    justify-content: center;
    gap: 56px;
    width: 100%;
  }
  .table-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .col-label {
    font-size: 0.65rem;
    color: #bbb;
    letter-spacing: 2px;
    text-align: center;
  }

  /* Table circles */
  .table-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .table-circle {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(145deg, #a8b89b, #92a586);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1), inset 0 1px 2px rgba(255,255,255,0.25);
    user-select: none;
    flex-shrink: 0;
  }
  .table-circle:active { transform: scale(0.93); }
  .t-num {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .t-label {
    font-size: 0.75rem;
    color: #888;
    text-align: center;
  }

  /* Main table */
  .table-circle.main-table {
    width: 88px; height: 88px;
    background: linear-gradient(145deg, #b09838, #8a7520);
    box-shadow: 0 4px 18px rgba(184,150,12,0.3), inset 0 2px 4px rgba(255,255,255,0.2);
  }
  .table-circle.main-table .t-num { font-size: 1.2rem; }

  /* Highlight */
  .table-circle.highlight {
    background: linear-gradient(145deg, #b09838, #8a7520) !important;
    box-shadow: 0 0 0 5px rgba(184,150,12,0.25), 0 0 20px rgba(184,150,12,0.3) !important;
    transform: scale(1.2);
    z-index: 10;
    animation: glow 1.8s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 5px rgba(184,150,12,0.25), 0 0 20px rgba(184,150,12,0.3); }
    50% { box-shadow: 0 0 0 10px rgba(184,150,12,0.12), 0 0 32px rgba(184,150,12,0.4); }
  }
  .table-circle.dimmed { opacity: 0.25; }

  /* Table info panel below map */
  .info-panel {
    max-width: 420px;
    margin: 14px auto 0;
    background: #fff;
    border: 1.5px solid #c9c4ab;
    border-radius: 16px;
    padding: 18px 20px;
    display: none;
    animation: fadeSlideIn 0.25s ease;
  }
  .info-panel.show { display: block; }
  .ip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .ip-title {
    font-weight: 700;
    font-size: 1.05rem;
    color: #7b6b2e;
  }
  .ip-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: #bbb;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .ip-close:active { color: #888; }
  .ip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
  }
  .ip-guest {
    font-size: 1rem;
    color: #555;
    padding: 3px 0;
  }
  .ip-guest.ip-me {
    color: #7b6b2e;
    font-weight: 700;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 16px 0 32px;
    color: #c9c4ab;
    font-size: 0.7rem;
    letter-spacing: 1px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 400px) {
    .table-columns { gap: 40px; }
    .table-circle { width: 64px; height: 64px; }
    .table-circle.main-table { width: 80px; height: 80px; }
    .t-num { font-size: 1rem; }
    .t-label { font-size: 0.7rem; }
  }
</style>

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const searchInput = $('#searchInput');
const clearBtn = $('#clearBtn');
const suggestionsEl = $('#suggestions');
const noResultEl = $('#noResult');
const resultCard = $('#resultCard');
const mapWrapper = $('#mapWrapper');
const infoPanel = $('#infoPanel');
const circles = $$('.table-circle');

let selected = null;

function fmt(t) { return t === '主桌' ? '主桌' : '第 ' + t + ' 桌'; }

function hl(name, q) {
  const i = name.indexOf(q);
  if (i < 0) return name;
  return name.slice(0,i) + '<b style="color:#7b6b2e">' + q + '</b>' + name.slice(i+q.length);
}

searchInput.addEventListener('input', function() {
  const q = this.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);
  noResultEl.classList.remove('show');
  infoPanel.classList.remove('show');

  if (!q) {
    suggestionsEl.classList.remove('show');
    resultCard.classList.remove('show');
    clearHL();
    return;
  }

  const m = guests.filter(g => g.name.includes(q));
  if (!m.length) {
    suggestionsEl.classList.remove('show');
    noResultEl.classList.add('show');
    return;
  }

  suggestionsEl.innerHTML = m.map(g =>
    `<div class="suggestion-item" data-idx="${guests.indexOf(g)}">
      <div class="s-name">${hl(g.name, q)}</div>
      <div class="s-table">${fmt(g.table)} - ${g.tableLabel}</div>
    </div>`
  ).join('');
  suggestionsEl.classList.add('show');

  if (m.length === 1) pick(m[0]);
});

suggestionsEl.addEventListener('click', e => {
  const it = e.target.closest('.suggestion-item');
  if (it) { pick(guests[+it.dataset.idx]); suggestionsEl.classList.remove('show'); }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('show');
  suggestionsEl.classList.remove('show');
  noResultEl.classList.remove('show');
  resultCard.classList.remove('show');
  infoPanel.classList.remove('show');
  clearHL();
  searchInput.focus();
});

function pick(g) {
  selected = g;
  searchInput.value = g.name;
  clearBtn.classList.add('show');
  noResultEl.classList.remove('show');
  suggestionsEl.classList.remove('show');

  $('#resultName').textContent = g.name;
  $('#resultTable').textContent = fmt(g.table);
  $('#resultGroup').textContent = g.tableLabel;
  resultCard.classList.add('show');

  // Highlight on map
  circles.forEach(c => {
    c.classList.remove('highlight','dimmed');
    c.dataset.table === g.table ? c.classList.add('highlight') : c.classList.add('dimmed');
  });

  // Scroll highlighted table into view
  const hc = document.querySelector('.table-circle.highlight');
  if (hc) {
    setTimeout(() => hc.scrollIntoView({ behavior:'smooth', block:'nearest' }), 350);
  }

  searchInput.blur();
  setTimeout(() => resultCard.scrollIntoView({ behavior:'smooth', block:'center' }), 200);
}

function clearHL() {
  selected = null;
  circles.forEach(c => c.classList.remove('highlight','dimmed'));
}

// Table click
circles.forEach(c => c.addEventListener('click', () => {
  const tid = c.dataset.table;
  const tg = guests.filter(g => g.table === tid);
  const gl = tg.length ? tg[0].tableLabel : '';

  infoPanel.innerHTML =
    `<div class="ip-head">
      <span class="ip-title">${fmt(tid)}${gl ? ' - '+gl : ''}</span>
      <button class="ip-close" onclick="this.closest('.info-panel').classList.remove('show')">&times;</button>
    </div>
    <div class="ip-list">${tg.map(g =>
      `<span class="ip-guest${selected && g.name===selected.name && g.table===selected.table ? ' ip-me' : ''}">${g.name}</span>`
    ).join('')}</div>`;
  infoPanel.classList.add('show');
  setTimeout(() => infoPanel.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
}));

// Close suggestions on outside tap
document.addEventListener('click', e => {
  if (!e.target.closest('.search-box') && !e.target.closest('.suggestions'))
    suggestionsEl.classList.remove('show');
});
</script>
